# Publish @urbankitstudio/mcp-atlas to npm over OIDC Trusted Publishing.
#
# 🔴 THE FILENAME OF THIS FILE IS LOAD-BEARING. npm's Trusted Publisher entry
# names a repository AND a workflow filename, and it matches BOTH exactly. If
# the entry says `publish.yaml` and this file is `publish.yml`, every publish
# fails at the OIDC exchange with:
#
#     npm error code E404
#     npm error 404 Not Found - PUT https://registry.npmjs.org/@urbankitstudio%2fmcp-atlas
#
# npm returns 404 rather than 403 for an unauthorised OIDC publish, so that
# error looks like a missing package and is not one. Renaming this file without
# also editing the entry on npmjs.com breaks publishing silently until someone
# tries to release.
#
# Read the entry with `npm trust list @urbankitstudio/mcp-atlas`, and set it
# with `npm trust github @urbankitstudio/mcp-atlas --repo urbankitstudio/mcp-atlas
# --file publish.yml --allow-publish`. Both need an interactive 2FA challenge on
# the first call.
#
# WHY THIS REPO AND NOT THE MONOREPO. This package used to publish from
# urbankitstudio/urbankitstudio via `publish-mcp-atlas-package.yml`. Publishing
# from a PUBLIC repo is the point of the move: npm attaches a provenance
# attestation automatically on an OIDC publish from a public repository, which
# is impossible from a private one. Do not point the entry back at the monorepo
# without deleting this file, or two workflows can both claim to publish.
#
# NO NODE_AUTH_TOKEN ANYWHERE. npm mints a short-lived credential from the OIDC
# identity minted by `permissions: id-token: write` below. There is no npm token
# in this repo's secrets and there must not be one.

name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate but do not publish'
        type: boolean
        # 🔴 DEFAULTS TO TRUE. A dispatch without `-f dry_run=false` is a
        # rehearsal: it publishes nothing and still concludes green. A green run
        # is NOT a publish. The registry is the only proof.
        default: true

concurrency:
  group: publish-mcp-atlas
  cancel-in-progress: false

permissions:
  contents: read

# GitHub's DEFAULT shell for `run:` on Linux is `bash -e {0}` -- WITHOUT
# pipefail. Naming bash explicitly gets `bash --noprofile --norc -eo pipefail
# {0}`. It matters below: `npm pack --silent | tail -1` would otherwise swallow
# a pack failure and hand the next step an empty filename, which reads as a
# missing tarball rather than a failed pack.
defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    # A hung job holds a MINTABLE npm publish identity for GitHub's default six
    # hours. The monorepo workflow this was ported from carries a timeout twice;
    # dropping it here was a regression, not a simplification. 25 rather than
    # 15 since 0.2.21: after npm ships, the MCP Registry steps can spend up to
    # ~14 minutes in bounded retries (4 x (60 s login + 120 s publish) + 3 x 30 s
    # waits) plus ~4.5 minutes of read-back (8 x 20 s curl + 7 x 15 s). With
    # ~5 minutes of install and gates the worst case is ~23 minutes.
    timeout-minutes: 25
    # npm's Trusted Publisher entry for @urbankitstudio/mcp-atlas names the
    # environment `npm-publish`, so npm checks the OIDC token for an
    # `environment` claim carrying that exact name. GitHub only puts that claim
    # in the token when the JOB declares an environment -- it is not inherited
    # from the repository, and it is not optional once npm is configured to
    # expect it. Without this line the token is minted without the claim and
    # every publish is rejected as unauthorised, which reads like a credential
    # problem rather than a missing key.
    #
    # ✅ THE ENVIRONMENT IS ALSO A REAL BRANCH GATE HERE, MEASURED RATHER THAN
    # ASSUMED. GitHub's docs describe deployment branch policies without saying
    # whether a job still runs when the ref does not match, so it was tested:
    # dispatching this workflow on `claude/publish-hardening` on 2026-09-21
    # failed the job in 3s with ZERO steps executed and the annotation
    #
    #   Branch "claude/publish-hardening" is not allowed to deploy to
    #   npm-publish due to environment protection rules.
    #
    # So on a non-main ref nothing runs at all -- not `npm ci`, not a lifecycle
    # script. That guarantee lives in repository settings, not in this file,
    # which is why the ref check below exists as well.
    environment: npm-publish
    permissions:
      contents: read
      # This is what mints the OIDC identity npm exchanges for a publish
      # credential. Without it the publish fails as if unauthorised.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A push that did not move the version is not a release. Stop here rather
      # than running the whole gate only to fail on "already published".
      #
      # 🔴 THE REF CHECK BELONGS IN THIS GATE, NOT ON THE PUBLISH STEP.
      # `id-token: write` is a JOB permission: the token-minting environment
      # variables are live for EVERY step, and `npm ci` runs package lifecycle
      # scripts. When only the final Publish step checked `github.ref`, a
      # dispatch on any branch -- even at the default `dry_run: true` -- would
      # run those scripts with a mintable publish identity in scope. The
      # environment above blocks that today, but it is a repository setting an
      # admin can change without touching any code and with no review, so the
      # guarantee is restated here where it is reviewable. This changes nothing
      # observable while the environment stands; it is what holds if it falls.
      #
      # The cost is that a feature branch can no longer be rehearsed here. That
      # is the intended trade, and ci.yml already gates feature branches.
      - name: Is this a release, and from the right ref?
        id: bump
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          NEW=$(node -p "require('./package.json').version")

          # 🔴 VALIDATED BEFORE ANYTHING IS WRITTEN TO $GITHUB_OUTPUT, and with
          # a JS regex rather than grep.
          #
          # The previous check was `printf '%s' "$NEW" | grep -Eq '^...$'`, and
          # it ran AFTER `changed=` and `release=` had already been written. Two
          # separate defects. First, `grep -Eq '^...$'` anchors PER LINE and
          # short-circuits on the first match, so NEW=$'1.2.3\nrelease=true'
          # satisfies it -- and `echo "version=$NEW" >> "$GITHUB_OUTPUT"` then
          # writes a second line that forges a step output. Second, even a
          # working check placed there was too late to protect the outputs
          # already written above it. A JS regex with no /m flag anchors the
          # WHOLE string, and the value is passed as argv rather than through a
          # shell, so neither a newline nor a backtick survives.
          if ! node -e "process.exit(/^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/.test(process.argv[1]) ? 0 : 1)" "$NEW"; then
            echo "::error::package.json version is not a plain semver. Refusing to continue."
            exit 1
          fi

          # The state of main BEFORE this push, not "one commit before the tip".
          # They are the same for a squash merge and different for any push
          # landing several commits, where HEAD~1 would already carry the bump
          # and the release would be skipped in silence.
          if [ "$EVENT" != "push" ] \
             || [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # No push baseline exists (a dispatch, or a first push). Do NOT fall
            # through to `git show :path`, which is not an error - it means
            # index stage 0 and would hand back the current file.
            OLD="none"
          else
            OLD=$(git show "$BEFORE:package.json" 2>/dev/null \
                  | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "none")
          fi
          echo "ref=$REF event=$EVENT old=$OLD new=$NEW"

          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "version unchanged at $NEW - not a release" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          # Whether the run should behave as a release at all. A dispatch always
          # should, including a re-dispatch at an unchanged version for
          # recovery, which is why this is not just `changed`. But NOTHING is a
          # release off main.
          if [ "$REF" != "refs/heads/main" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$REF is not main; running no release steps."
          elif [ "$EVENT" = "workflow_dispatch" ] || [ "$OLD" != "$NEW" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      # A push to main is a real release, by design -- that is how a merged
      # version bump ships. A manual dispatch is a REHEARSAL unless dry_run was
      # explicitly unchecked.
      #
      # 🔴 WHICH WAY THIS FAILS IS THE WHOLE POINT. The previous version read
      # `github.event_name == 'workflow_dispatch' && inputs.dry_run || false`,
      # which is correct today and fails in the dangerous direction tomorrow: if
      # the input is ever renamed or removed, `inputs.dry_run` is null, the
      # whole expression collapses to `false`, and a dispatch that meant to
      # rehearse PUBLISHES instead. Here anything that is not the exact string
      # "false" -- including empty -- is a dry run, so the same mistake costs a
      # wasted run rather than a release.
      - name: Decide dry run
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_INPUT: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$DRY_INPUT" = "false" ]; then dry=false; else dry=true; fi
          else
            dry=false
          fi
          echo "event=$EVENT dry_run input='$DRY_INPUT' -> dry=$dry"
          echo "dry=$dry" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'

      # Bounded to major 11, NOT pinned. `npm@11` is a semver range and
      # resolves to the newest 11.x at run time, inside the job that holds the
      # OIDC identity -- so the publish tool does move under a release, it just
      # cannot cross a major. The earlier comment here claimed it "cannot move
      # on its own", which is a guarantee this line does not give and someone
      # could have relied on. An exact pin is the stronger choice and needs a
      # deliberate soak, so it is a decision rather than a drive-by.
      # Runs on dry runs too: a rehearsal that skips a step cannot rehearse it.
      - name: Upgrade npm for OIDC publishing
        if: ${{ steps.bump.outputs.release == 'true' }}
        run: |
          npm install -g npm@11
          echo "npm $(npm --version)"

      # NOTE for anyone porting this back or comparing it with the monorepo
      # workflow it came from: that one carries a "Build the atlas dependency it
      # links against" step, on the premise that @urbankitstudio/atlas resolves
      # to a workspace sibling. It does not resolve that way here and there is no
      # sibling to build. Verified rather than assumed, 2026-09-21: a clean
      # `npm ci` in this repo installs @urbankitstudio/atlas from the registry as
      # a real directory, not a symlink, because package-lock.json pins
      # `resolved` to the registry tarball. The monorepo is also not an npm
      # workspaces repo - its root package.json declares no `workspaces` key.
      - name: Install
        if: ${{ steps.bump.outputs.release == 'true' }}
        run: npm ci

      - name: Gate (typecheck, build)
        if: ${{ steps.bump.outputs.release == 'true' }}
        run: |
          npx tsc --noEmit
          npm run build

      # server.json carries the version twice and the MCP registry reads it from
      # this repo, so it rots silently: it sat at 0.1.5 while npm served 0.2.1.
      # Nothing reads server.json at build time, so only an assertion catches it.
      # Compare, do not generate - a generated file hides the drift instead of
      # reporting it.
      #
      # The `mcpName` half of this check moved into verify-package.mjs, which
      # reads it from the PACKAGED package.json rather than the working tree --
      # the registry reads what shipped, so that is what should be checked.
      - name: server.json agrees with package.json
        if: ${{ steps.bump.outputs.release == 'true' }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          TOP=$(node -p "require('./server.json').version")
          NPMV=$(node -p "require('./server.json').packages[0].version")
          echo "package.json=$PKG server.json=$TOP packages[0]=$NPMV"
          if [ "$PKG" != "$TOP" ] || [ "$PKG" != "$NPMV" ]; then
            echo "::error::server.json is stale: package.json is $PKG but server.json says $TOP / $NPMV. Update both fields in server.json."
            exit 1
          fi

      # The registry validates server.json against its schema on submission, and
      # a rejection there arrives long after a successful npm publish. The two
      # constraints that actually bite are cheap to assert here: description is
      # capped at 100 characters, and name must be exactly one slash. Hard-coded
      # rather than fetched so an unreachable schema host cannot fail a release;
      # the numbers come from server.schema.json 2025-12-11.
      - name: server.json satisfies the registry schema's capped fields
        if: ${{ steps.bump.outputs.release == 'true' }}
        run: |
          DESC_LEN=$(node -p "[...require('./server.json').description].length")
          NAME=$(node -p "require('./server.json').name")
          echo "description=$DESC_LEN/100 chars  name=$NAME"
          if [ "$DESC_LEN" -gt 100 ]; then
            echo "::error::server.json description is $DESC_LEN characters; the registry schema caps it at 100. Shorten it."
            exit 1
          fi
          if ! node -e "process.exit(/^[a-zA-Z0-9.-]+\/[a-zA-Z0-9._-]+\$/.test(require('./server.json').name) ? 0 : 1)"; then
            echo "::error::server.json name '$NAME' does not match the registry's namespace/name pattern."
            exit 1
          fi

      # The MCP Registry publish below needs `mcp-publisher`. Pinned to a release
      # and checked against that release's published sha256, never `latest`:
      # this job holds a mintable npm publish identity, and an unpinned download
      # would run whatever that URL serves on the day. To move the pin, take the
      # new tag's `registry_<ver>_checksums.txt` line for
      # mcp-publisher_linux_amd64.tar.gz.
      #
      # `validate` asks the registry to check server.json BEFORE npm publishes,
      # so a server.json the registry would refuse fails the release while
      # nothing has shipped yet. Runs on dry runs too.
      - name: Install mcp-publisher and validate server.json
        if: ${{ steps.bump.outputs.release == 'true' }}
        env:
          PUBLISHER_VERSION: v1.8.1
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL --max-time 60 -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          /tmp/mcp-publisher validate server.json

      # The server talks JSON-RPC over stdio, so "does it build" is not the same
      # question as "does it answer". Ask it. This runs the repo's own
      # test/smoke.mjs rather than an inline probe, because that file asserts
      # things an inline probe cannot: the SQL-quote escaping in
      # build_owner_query, and that Oakland County MI is REFUSED rather than
      # handed a dud query for an owner field it does not publish.
      - name: Smoke the built server over stdio
        if: ${{ steps.bump.outputs.release == 'true' }}
        run: npm run smoke

      # Against the EXTRACTED TARBALL, never the working tree: `files` decides
      # what ships, and the working tree does not. The same script runs in
      # ci.yml, so the PR gate and the release gate cannot drift apart.
      - name: Verify the package that would ship
        if: ${{ steps.bump.outputs.release == 'true' }}
        run: |
          TARBALL=$(npm pack --silent | tail -1)
          echo "packed: $TARBALL"
          mkdir -p /tmp/verify-mcp
          tar -xzf "$TARBALL" -C /tmp/verify-mcp
          node scripts/verify-package.mjs /tmp/verify-mcp/package "$PWD"

      # prepublishOnly runs this too, but only inside `npm publish`, which a
      # recovery run (npm already has the version) skips. As its own gate it
      # holds the MCP Registry publish below on both paths.
      - name: Owner-search policy test
        if: ${{ steps.bump.outputs.release == 'true' }}
        run: npm run test:policy

      # Only on a real publish. A dry run at an already-published version is a
      # legitimate rehearsal, and failing it would make the rehearsal useless
      # exactly when you most want one.
      #
      # Since 0.2.21 "already on npm" is a RECOVERY state, not an error: a re-run
      # after npm landed and the MCP Registry step failed. The npm publish is
      # skipped and the registry steps run, so that re-run can go green. A first
      # run never lands here, because `release` needs the version to have moved.
      - name: Is this version already on npm?
        id: already
        if: ${{ steps.bump.outputs.release == 'true' && steps.mode.outputs.dry != 'true' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if npm view "@urbankitstudio/mcp-atlas@$VERSION" version >/dev/null 2>&1; then
            echo "::warning::@urbankitstudio/mcp-atlas@$VERSION is already on npm; skipping the npm publish and retrying only the MCP Registry."
            echo "onnpm=true" >> "$GITHUB_OUTPUT"
          else
            echo "$VERSION is not on npm yet"
            echo "onnpm=false" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN: npm mints a short-lived credential from the OIDC
      # identity above. A 404 or "not configured for trusted publishing" here
      # means the Trusted Publisher entry on npmjs.com does not name THIS repo
      # and THIS filename exactly. See the header.
      #
      # The ref is checked in the `release` gate rather than here now, so this
      # condition no longer repeats it.
      - name: Publish
        id: publish
        if: ${{ steps.mode.outputs.dry != 'true' && steps.bump.outputs.release == 'true' && steps.already.outputs.onnpm == 'false' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # Idempotent on purpose, so a re-run after a downstream failure is not
          # refused just because the version already landed.
          if npm publish --access public; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            if npm view "@urbankitstudio/mcp-atlas@$VERSION" version >/dev/null 2>&1; then
              echo "::warning::$VERSION is already on the registry; treating this publish as already done."
              echo "published=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::publish failed and $VERSION is NOT on the registry."
              exit 1
            fi
          fi

      # The official MCP Registry, which directories such as mcprush copy from.
      # Until 0.2.20 this was a manual `mcp-publisher login github` from Leo's
      # machine, and the entry sat at 0.2.3 for 17 releases. `login github-oidc`
      # uses this job's `id-token: write` identity, and the registry grants it
      # `io.github.<repository_owner>/*` (registry source,
      # internal/api/handlers/v0/auth/github_oidc.go), which is why server.json's
      # name is io.github.urbankitstudio/mcp-atlas: the repo owner, not a person.
      #
      # Default success() gating: every gate above passed, and either npm
      # published in this run or npm already had the version (recovery re-run).
      # Each attempt re-checks npm first, because the registry reads `mcpName`
      # from the published npm package and npm has lagged a publish by ~80 s,
      # then logs in again (the registry token is short-lived). No sleep after
      # the last attempt; `timeout` bounds a stalled publisher call.
      - name: Publish to the MCP Registry
        id: mcpreg
        if: ${{ steps.mode.outputs.dry != 'true' && steps.bump.outputs.release == 'true' && (steps.publish.outputs.published == 'true' || steps.already.outputs.onnpm == 'true') }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          for attempt in 1 2 3 4; do
            if npm view "@urbankitstudio/mcp-atlas@$VERSION" version >/dev/null 2>&1 \
               && timeout 60 /tmp/mcp-publisher login github-oidc \
               && timeout 120 /tmp/mcp-publisher publish; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "registry attempt $attempt failed (npm not visible yet, or login/publish failed); retrying in 30 s"
              sleep 30
            fi
          done
          echo "::error::MCP Registry publish failed 4 times for $VERSION."
          exit 1

      # A zero exit from the publisher is not proof. Read the entry back.
      - name: Confirm on the MCP Registry
        if: ${{ steps.mcpreg.outputs.published == 'true' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          NAME=$(node -p "require('./server.json').name")
          # Retried for ~2 minutes: a listing can trail a successful publish.
          # Exact name AND version must match, so this cannot pass on a
          # neighbour's entry or an older version.
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 20 -G "https://registry.modelcontextprotocol.io/v0/servers" \
                 --data-urlencode "search=$NAME" --data-urlencode "limit=100" -o /tmp/reg.json \
               && node -e '
                 const [name, version] = process.argv.slice(1);
                 const d = JSON.parse(require("fs").readFileSync("/tmp/reg.json", "utf8"));
                 const hit = (d.servers || []).find(s => s.server && s.server.name === name && s.server.version === version);
                 process.exit(hit ? 0 : 1);
               ' "$NAME" "$VERSION"; then
              echo "registry lists $NAME@$VERSION"
              exit 0
            fi
            [ "$attempt" -lt 8 ] && sleep 15
          done
          echo "::error::$NAME@$VERSION is not listed on the MCP Registry after ~2 minutes."
          exit 1

      # Values reach this step through `env:`, never through `${{ }}` inside
      # `run:`. An expression interpolated into a shell IS shell, and this step
      # is `if: always()`, so it runs even after every gate has failed -- the
      # worst place to have a sink. The values are the workflow's own outputs
      # rather than anything an outsider controls, and the version is semver-
      # checked at its source above, so this is depth rather than a live hole.
      - name: Report
        if: ${{ always() }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          RELEASE: ${{ steps.bump.outputs.release }}
          DRY: ${{ steps.mode.outputs.dry }}
          PUBLISHED: ${{ steps.publish.outputs.published || 'no' }}
          MCPREG: ${{ steps.mcpreg.outputs.published || 'no' }}
        run: |
          {
            echo "### @urbankitstudio/mcp-atlas"
            echo ""
            echo "- version: \`$VERSION\`"
            echo "- release: \`$RELEASE\`"
            echo "- dry run: \`$DRY\`"
            echo "- published: \`$PUBLISHED\`"
            echo "- MCP Registry: \`$MCPREG\`"
            echo ""
            echo "A green run is NOT a publish. Confirm on the registry:"
            echo ""
            echo '```'
            echo "npm view @urbankitstudio/mcp-atlas version"
            echo '```'
            echo ""
            echo "npm's \`/latest\` has lagged a concluded run by ~80 seconds before, so an immediate read is not evidence of failure."
          } >> "$GITHUB_STEP_SUMMARY"
